<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日报归档</title><style>
:root { color-scheme:light dark; --bg:#f3f6f8; --ink:#172737; --muted:#43576a;
  --line:#b6c7d2; --link:#005973; --tint:#dcebf1; }
@media(prefers-color-scheme:dark) {
  :root { --bg:#131e27; --ink:#eaf2f7; --muted:#afc3d1; --line:#435b6e;
    --link:#92def5; --tint:#233743; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.75 system-ui,"Noto Sans CJK SC",sans-serif; }
main { width:min(65rem,100%); margin:auto; padding:clamp(1rem,5vw,4rem); }
header { border-top:.3rem solid var(--link); border-bottom:1px solid var(--line);
  padding:1rem 0 1.6rem; margin-bottom:2rem; }
nav, .meta { font:0.85rem/1.6 ui-monospace,monospace; color:var(--muted); }
nav { display:flex; gap:.8rem 1.5rem; flex-wrap:wrap; }
h1,h2,h3 { line-height:1.3; text-wrap:balance; }
h1 { font-size:clamp(2rem,6vw,3.7rem); margin:.9rem 0 .25rem; }
h2 { font-size:1.5rem; margin:0; }
h3 { font-size:1.2rem; margin:0; }
a { color:var(--link); text-underline-offset:.2em; overflow-wrap:anywhere; }
a:focus-visible { outline:2px solid var(--link); outline-offset:3px; }
section { display:grid; gap:1.15rem; margin-bottom:2.5rem; }
article { display:grid; gap:.45rem; padding-top:1rem; border-top:1px solid var(--line); }
p { margin:0; max-width:65ch; }
.badge { width:fit-content; background:var(--tint); padding:.1rem .55rem;
  color:var(--link); font-weight:650; font-size:.82rem; }
ul { margin:0; padding-inline-start:1.2rem; }
li+li { margin-top:.5rem; }
footer { padding-top:1rem; border-top:1px solid var(--line); color:var(--muted); }
@media print { :root { color-scheme:light; --bg:#fff; --ink:#111; --muted:#333;
  --line:#999; --link:#234; --tint:#eee; } article { break-inside:avoid; } }
</style></head>
<body><main><header><nav aria-label="日报导航"><a href="../">最新一期</a></nav>
<h1>日报归档</h1><p class="meta">AGENTIC VLA / RSI</p></header>
<section><h2>全部日期</h2><ul><li><a href="../2026-11-07/"><time datetime="2026-11-07">2026-11-07</time></a></li></ul></section><footer>工作记录以北京时间为准。研究条目注明原始来源及证据范围。</footer>
</main></body></html>
